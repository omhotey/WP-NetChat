name: wordpress-lab

services:
  db:
    image: mariadb:11.8.3@sha256:ae6119716edac6998ae85508431b3d2e666530ddf4e94c61a10710caec9b0f71
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:?Set WORDPRESS_DB_NAME in .env}
      MARIADB_USER: ${WORDPRESS_DB_USER:?Set WORDPRESS_DB_USER in .env}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Set WORDPRESS_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  wordpress:
    image: wordpress:7.0.4-php8.3-apache@sha256:b427cec767f5de2aa649390cb8805aa1fe320e1e0d57fc1f467754edb6cc0a49
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DEBUG: "1"
      WORDPRESS_LAB_SMTP_HOST: mailpit
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wordpress_data:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/zz-wordpress-lab-uploads.ini:ro
      - ./mu-plugins/lab-mail.php:/var/www/html/wp-content/mu-plugins/lab-mail.php:ro
      - type: bind
        source: ${NETCHAT_PROJECT_PATH:-../WP NetChat}
        target: /var/www/html/wp-content/plugins/netchat
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent http://127.0.0.1/wp-includes/images/blank.gif >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  wpcli:
    image: wordpress:cli-2.12.0-php8.3@sha256:36243da432a0f0a3b56dc3240ecee9b159108d71305e7c064d987a20a465bfde
    profiles: [tools]
    depends_on:
      wordpress:
        condition: service_healthy
    user: "33:33"
    environment:
      HOME: /tmp
      HTTP_HOST: localhost:${WORDPRESS_PORT:-8080}
      LAB_URL: http://localhost:${WORDPRESS_PORT:-8080}
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER:?Set WORDPRESS_ADMIN_USER in .env}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD:?Set WORDPRESS_ADMIN_PASSWORD in .env}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL:?Set WORDPRESS_ADMIN_EMAIL in .env}
      WORDPRESS_LAB_SMTP_HOST: mailpit
    volumes:
      - wordpress_data:/var/www/html
      - ./scripts:/lab-scripts:ro
      - ./mu-plugins/lab-mail.php:/var/www/html/wp-content/mu-plugins/lab-mail.php:ro
      - type: bind
        source: ${NETCHAT_PROJECT_PATH:-../WP NetChat}
        target: /var/www/html/wp-content/plugins/netchat
        read_only: true
        bind:
          create_host_path: false
    working_dir: /var/www/html
    entrypoint: [wp]

  mailpit:
    image: axllent/mailpit:v1.27.0@sha256:fb84cfb1c3a33007cfdee8ba5a77b8c6c894de5b1a368372ddc5c965cf5c0b6d
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    volumes:
      - mailpit_data:/data

volumes:
  database_data:
  wordpress_data:
  mailpit_data:
