<!doctype html><html lang="ru"><meta charset="utf-8"><title>Visibility 009 isolated fixture</title><style>html,body{margin:0}#page{height:2000px}#netchat{position:fixed;right:20px;bottom:30px}</style><body>
<main id="page"><button id="sentinel">Фокус до виджета</button><button id="manual" data-netchat-open="form">Ручная форма</button></main>
<div id="netchat" class="nc-wrap nc-scroll-wait"><div class="nc-col">
<div id="nc-bubble" class="nc-bubble" aria-hidden="true"><a class="nc-btn nc-telegram" href="#channel" tabindex="-1">Канал</a></div>
<div class="nc-main-wrap"><button id="nc-toggle" class="nc-btn nc-main" hidden aria-expanded="false" aria-controls="nc-bubble">Меню</button>
<div id="nc-hint" class="nc-hint nc-hint-no-mobile" hidden><div class="nc-hint-content">Подсказка <a id="hint-link" href="#help">Помощь</a></div><button class="nc-hint-close" aria-label="Закрыть подсказку">×</button></div></div></div></div>
<div id="nc-leads-modal" hidden><section class="nc-leads-dialog" role="dialog" aria-modal="true" aria-labelledby="nc-leads-title" tabindex="-1"><h2 id="nc-leads-title">Форма</h2><button data-netchat-close>Закрыть</button><form id="nc-leads-form"><input name="email" type="email"><button type="submit">Отправить</button><p id="nc-leads-status"></p></form><div id="nc-leads-success" hidden tabindex="-1"><button data-netchat-close>Готово</button></div></section></div>
<template id="visibility-admin"><div class="netchat-admin"><div class="nc-card nc-card-greeting"><input id="nc-opt-h" type="checkbox"><label for="nc-opt-hmobile">Показывать подсказку на телефонах</label><input id="nc-opt-hmobile" type="checkbox"><div id="nc-greeting-fields"><textarea id="nc-opt-ht"></textarea><label for="nc-opt-hd">Подсказка: время от открытия страницы</label><input id="nc-opt-hd" type="number" min="0" max="600" step="1" required><label for="nc-opt-hscroll">Прокрутка подсказки</label><input id="nc-opt-hscroll" type="number" min="0" max="100" step="1" required></div></div><div class="nc-card nc-card-visibility"><label for="nc-opt-bd">Кнопка: время от открытия страницы</label><input id="nc-opt-bd" type="number" min="0" max="600" step="1" required><label for="nc-opt-bscroll">Прокрутка кнопки</label><input id="nc-opt-bscroll" type="number" min="0" max="100" step="1" required><input id="nc-opt-d" type="checkbox"><input id="nc-opt-m" type="checkbox"></div><button id="nc-save-btn">Сохранить</button><button id="nc-reset-btn">Сбросить</button></div></template></body></html>
