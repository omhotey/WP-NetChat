name: Release compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Preserve source bytes on this temporary worker
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reproduce the single reviewed installer
        shell: pwsh
        run: python tools/build-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          if-no-files-found: error
          path: |
            dist/release-1.2.2/netchat-wp-1.2.2.zip
            dist/release-1.2.2/netchat-wp-1.2.2.zip.manifest.json
            dist/release-1.2.2/SHA256SUMS.txt
  runtime:
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.2'
            wordpress: '5.0'
          - php: '8.3'
            wordpress: '7.1.3'
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: netchat-ci-disposable
          MYSQL_DATABASE: netchat_ci
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, zip, curl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pinned browser tooling on the temporary worker
        run: |
          npm install --prefix "$RUNNER_TEMP/netchat-browser" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/netchat-browser/node_modules/.bin/playwright" install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/release-1.2.2
      - name: Actual core, integration and exact ZIP runtime checks
        env:
          NETCHAT_WP_VERSION: ${{ matrix.wordpress }}
          NETCHAT_PHP_VERSION: ${{ matrix.php }}
          NETCHAT_DB_HOST: 127.0.0.1:3306
          NETCHAT_DB_NAME: netchat_ci
          NETCHAT_DB_USER: root
          NETCHAT_DB_PASSWORD: netchat-ci-disposable
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/netchat-browser/node_modules/playwright
          NETCHAT_TEST_ORIGIN: http://localhost:8080
        run: |
          bash -n tests/compatibility-ci.sh
          sh -n tests/release-smoke.sh
          bash tests/compatibility-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-browser-${{ matrix.wordpress }}-php-${{ matrix.php }}
          if-no-files-found: error
          path: |
            dist/release-1.2.2/browser/verification.json
            dist/release-1.2.2/browser/*.png
            dist/release-1.2.2/transfer-browser/verification.json
            dist/release-1.2.2/transfer-browser/*.png
            dist/release-1.2.2/scroll-browser/verification.json
            dist/release-1.2.2/scroll-browser/*.png
  javascript:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: find assets/js -name '*.js' -print0 | xargs -0 -n 1 node --check
      - run: node tests/normalization.test.cjs
